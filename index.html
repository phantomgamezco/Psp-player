<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web PSP Player</title>
  <script src="coi-serviceworker.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0f0f13;
      color: #f4f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #upload-box {
      text-align: center;
      padding: 2.5rem;
      border: 2px dashed #3a3a45;
      border-radius: 14px;
      background: #18181f;
      max-width: 440px;
      width: 90%;
    }
    #upload-box h2 {
      margin-top: 0;
    }
    #upload-box p {
      color: #a0a0b0;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    #rom-input {
      display: none;
    }
    .upload-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #4f46e5;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .upload-btn:hover {
      background: #4338ca;
    }
    #game-container {
      width: 960px;
      height: 544px;
      max-width: 100vw;
      max-height: 100vh;
      display: none;
    }
  </style>
</head>
<body>

  <div id="upload-box">
    <h2>PSP Browser Player</h2>
    <p>Select a PSP game file (.iso, .cso, .pbp, or .zip) from your device to launch.</p>
    <label for="rom-input" class="upload-btn">Choose Game File</label>
    <input type="file" id="rom-input" accept=".iso,.cso,.zip,.pbp" />
  </div>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    const input = document.getElementById("rom-input");
    const uploadBox = document.getElementById("upload-box");
    const gameContainer = document.getElementById("game-container");

    input.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const blobUrl = URL.createObjectURL(file);

      uploadBox.style.display = "none";
      gameContainer.style.display = "block";

      window.EJS_player = "#game";
      window.EJS_core = "psp";
      window.EJS_gameName = file.name.replace(/\.[^/.]+$/, "");
      window.EJS_gameUrl = blobUrl;
      window.EJS_threads = true;
      window.EJS_pathtodata = "https://emulatorjs.org";

      const script = document.createElement("script");
      script.src = "https://emulatorjs.orgloader.js";
      document.body.appendChild(script);
    });
  </script>

</body>
</html>
